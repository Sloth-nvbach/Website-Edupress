<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bảng điều khiển Edupress - Quản lý khóa học, tiến độ học tập và hồ sơ cá nhân.">
  <title>Bảng điều khiển - Edupress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Chuyển đến nội dung chính</a>

  <div id="header-placeholder"></div>

  <main id="main-content" role="main">
    <div class="container" style="padding-top: 32px; padding-bottom: 48px;">
      <div id="dashboard-content">
        <div class="empty-state" style="grid-column: 1 / -1;">
          <div class="empty-state-icon">⏳</div>
          <h3 class="empty-state-title">Đang tải bảng điều khiển...</h3>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    Utils.onReady(() => {
      if (!Auth.requireAuth()) return;

      const user = Auth.currentUser;
      const enrollments = Storage.getEnrollments(user.id);
      const favorites = Storage.getFavorites(user.id);

      const activeCourses = enrollments.filter(e => e.status === 'active');
      const completedCourses = enrollments.filter(e => e.progress >= 100);
      const inProgressCourses = enrollments.filter(e => e.progress > 0 && e.progress < 100);

      const container = Utils.getElement('#dashboard-content');
      container.innerHTML = `
        <div style="margin-bottom: 32px;">
          <h1 class="section-title" style="margin-bottom: 8px;">Chào mừng, ${Utils.escapeHtml(user.name)}!</h1>
          <p class="section-subtitle">Tổng quan tiến độ học tập của bạn</p>
        </div>

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-value">${enrollments.length}</div>
            <div class="stat-label">Tổng khóa học đã đăng ký</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${inProgressCourses.length}</div>
            <div class="stat-label">Đang học</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${completedCourses.length}</div>
            <div class="stat-label">Đã hoàn thành</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${favorites.length}</div>
            <div class="stat-label">Khóa học yêu thích</div>
          </div>
        </div>

        ${inProgressCourses.length > 0 ? `
          <section class="dashboard-card" style="margin-bottom: 24px;">
            <h2 class="dashboard-card-title">Tiếp tục học</h2>
            <div class="grid grid-3" id="continue-learning-grid"></div>
          </section>
        ` : ''}

        ${activeCourses.length > 0 ? `
          <section class="dashboard-card" style="margin-bottom: 24px;">
            <div class="flex-between" style="margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
              <h2 class="dashboard-card-title" style="margin-bottom: 0;">Khóa học của bạn</h2>
              <a href="courses.html" class="btn btn-outline btn-sm">Khám phá thêm</a>
            </div>
            <div class="grid grid-3" id="my-courses-grid"></div>
          </section>
        ` : `
          <section class="dashboard-card" style="margin-bottom: 24px; text-align: center;">
            <h2 class="dashboard-card-title">Khóa học của bạn</h2>
            <div class="empty-state" style="padding: 40px 20px;">
              <div class="empty-state-icon">📚</div>
              <h3 class="empty-state-title">Chưa có khóa học nào</h3>
              <p class="empty-state-desc">Hãy khám phá và đăng ký khóa học đầu tiên của bạn!</p>
              <a href="courses.html" class="btn btn-primary">Tìm khóa học</a>
            </div>
          </section>
        `}

        ${favorites.length > 0 ? `
          <section class="dashboard-card">
            <h2 class="dashboard-card-title">Khóa học yêu thích</h2>
            <div class="grid grid-3" id="favorites-grid"></div>
          </section>
        ` : ''}
      `;

      renderContinueLearning(inProgressCourses);
      renderMyCourses(activeCourses);
      renderFavorites(favorites);
    });

    function renderContinueLearning(courses) {
      const container = Utils.getElement('#continue-learning-grid');
      if (!container || courses.length === 0) return;

      container.innerHTML = courses.slice(0, 3).map(enrollment => {
        const course = Storage.getCourseById(enrollment.courseId);
        if (!course) return '';

        const nextLessonIndex = course.lessons.findIndex(l => !enrollment.completedLessons.includes(l.id));
        const nextLesson = nextLessonIndex >= 0 ? course.lessons[nextLessonIndex] : null;

        return `
          <article class="card course-card" style="flex-direction: row; height: auto;">
            <div class="course-card-image" style="width: 120px; height: 75px; aspect-ratio: auto; flex-shrink: 0; border-radius: var(--radius-md);">
              <img src="${Utils.escapeHtml(course.thumbnail || 'assets/images/course-placeholder.svg')}" alt="" loading="lazy" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='assets/images/course-placeholder.png'">
            </div>
            <div class="course-card-content" style="flex: 1; padding: 12px;">
              <h3 class="course-card-title" style="font-size: 15px; margin-bottom: 8px;">${Utils.escapeHtml(course.title)}</h3>
              <div class="progress-bar" style="margin-bottom: 8px;">
                <div class="progress-fill" style="width: ${enrollment.progress}%"></div>
              </div>
              <div style="font-size: 13px; color: var(--text-secondary);">
                ${nextLesson ? `Bài tiếp theo: ${Utils.escapeHtml(nextLesson.title)}` : 'Hoàn thành tất cả bài học'}
              </div>
              <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">${enrollment.progress}% hoàn thành</div>
            </div>
          </article>
        `;
      }).join('');

      container.querySelectorAll('.course-card').forEach((card, index) => {
        const enrollment = courses[index];
        card.addEventListener('click', () => {
          window.location.href = `learning.html?id=${enrollment.courseId}`;
        });
        card.style.cursor = 'pointer';
      });
    }

    function renderMyCourses(enrollments) {
      const container = Utils.getElement('#my-courses-grid');
      if (!container) return;

      container.innerHTML = enrollments.map(enrollment => {
        const course = Storage.getCourseById(enrollment.courseId);
        if (!course) return '';

        const progressPercent = enrollment.progress;
        const isCompleted = progressPercent >= 100;

        return `
          <article class="card course-card">
            <div class="course-card-image">
              <img src="${Utils.escapeHtml(course.thumbnail || 'assets/images/course-placeholder.svg')}" alt="${Utils.escapeHtml(course.title)}" loading="lazy" onerror="this.src='assets/images/course-placeholder.png'">
              <div class="course-card-badges">
                ${isCompleted ? '<span class="badge badge-free">Hoàn thành</span>' : ''}
                ${course.isFree ? '<span class="badge badge-free">Miễn phí</span>' : ''}
              </div>
            </div>
            <div class="course-card-content">
              <h3 class="course-card-title">${Utils.escapeHtml(course.title)}</h3>
              <div class="progress-bar" style="margin: 12px 0;">
                <div class="progress-fill" style="width: ${progressPercent}%"></div>
              </div>
              <div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">
                ${progressPercent}% hoàn thành (${enrollment.completedLessons.length}/${course.lessons?.length || 0} bài)
              </div>
              <div class="course-card-footer">
                <a href="learning.html?id=${course.id}" class="btn btn-primary btn-sm" style="width: 100%;">${isCompleted ? 'Xem lại' : 'Tiếp tục học'}</a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderFavorites(favorites) {
      const container = Utils.getElement('#favorites-grid');
      if (!container) return;

      container.innerHTML = favorites.map(fav => {
        const course = Storage.getCourseById(fav.courseId);
        if (!course) return '';

        return `
          <article class="card course-card">
            <div class="course-card-image">
              <img src="${Utils.escapeHtml(course.thumbnail || 'assets/images/course-placeholder.svg')}" alt="${Utils.escapeHtml(course.title)}" loading="lazy" onerror="this.src='assets/images/course-placeholder.png'">
            </div>
            <div class="course-card-content">
              <h3 class="course-card-title">${Utils.escapeHtml(course.title)}</h3>
              <div class="course-card-meta">
                <span>👨‍🏫 ${Utils.escapeHtml(course.instructor || 'Giảng viên')}</span>
                <span>📚 ${course.lessons ? course.lessons.length : 0} bài</span>
              </div>
              <div class="course-card-footer">
                <div class="course-card-price">
                  ${course.isFree ? '<span class="price-free">Miễn phí</span>' : `<span class="price-current">${Utils.formatCurrency(course.price)}</span>`}
                </div>
                <button class="btn btn-danger btn-sm remove-favorite" data-course-id="${course.id}">Bỏ thích</button>
              </div>
            </div>
          </article>
        `;
      }).join('');

      container.querySelectorAll('.remove-favorite').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const courseId = btn.dataset.courseId;
          const result = Storage.toggleFavorite(Auth.currentUser.id, courseId);
          if (result.success) {
            Utils.showToast('Đã bỏ khỏi yêu thích', 'success');
            setTimeout(() => window.location.reload(), 500);
          }
        });
      });
    }
  </script>
</body>
</html>
