<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trang học tập Edupress - Xem bài học, theo dõi tiến độ và đánh dấu hoàn thành.">
  <title>Học tập - Edupress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Chuyển đến nội dung chính</a>

  <div id="header-placeholder"></div>

  <main id="main-content" role="main">
    <div id="learning-content">
      <div class="container" style="padding: 40px 20px; text-align: center;">
        <div class="empty-state">
          <div class="empty-state-icon">⏳</div>
          <h3 class="empty-state-title">Đang tải khóa học...</h3>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/learning.js"></script>
  <script src="js/app.js"></script>
  <script>
    Utils.onReady(() => {
      const params = Utils.getUrlParams();
      const courseId = params.id;

      if (!courseId) {
        window.location.href = 'courses.html';
        return;
      }

      if (!Auth.requireAuth()) return;

      const enrollment = Storage.getEnrollment(Auth.currentUser.id, courseId);
      const course = Storage.getCourseById(courseId);

      if (!course) {
        window.location.href = 'courses.html';
        return;
      }

      if (!enrollment && !course.isFree) {
        Utils.showToast('Bạn chưa đăng ký khóa học này', 'warning');
        setTimeout(() => window.location.href = `course-detail.html?id=${courseId}`, 2000);
        return;
      }

      const container = Utils.getElement('#learning-content');
      container.innerHTML = `
        <div class="container" style="padding: 24px 20px 48px;">
          <nav aria-label="Breadcrumb" style="margin-bottom: 24px;">
            <ol class="flex gap-8" style="font-size: 14px; color: var(--text-muted); flex-wrap: wrap;">
              <li><a href="index.html" style="color: var(--text-muted);">Trang chủ</a></li>
              <li aria-hidden="true">/</li>
              <li><a href="dashboard.html" style="color: var(--text-muted);">Bảng điều khiển</a></li>
              <li aria-hidden="true">/</li>
              <li aria-current="page" style="color: var(--text-primary); font-weight: 500;">${Utils.escapeHtml(course.title)}</li>
            </ol>
          </nav>

          <div style="display: grid; grid-template-columns: 280px 1fr; gap: 24px;">
            <aside id="sidebar" style="position: sticky; top: 90px; height: fit-content;">
              <div class="card" style="padding: 0;">
                <div style="padding: 20px; border-bottom: 1px solid var(--border-color);">
                  <h2 style="font-size: 16px; font-weight: 600;">Nội dung khóa học</h2>
                </div>
                <div id="lesson-list" style="max-height: calc(100vh - 200px); overflow-y: auto;"></div>
              </div>

              <div class="course-progress" style="margin-top: 16px;">
                <div class="card" style="padding: 20px;">
                  <div class="progress-header">
                    <span class="progress-text">Tiến độ tổng thể</span>
                    <span class="progress-percent" id="progress-percent">0%</span>
                  </div>
                  <div class="progress-bar" style="height: 10px;">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                  </div>
                  <div style="margin-top: 12px; text-align: center;">
                    <button class="btn btn-primary" id="continue-learning" style="width: 100%;">Tiếp tục học</button>
                  </div>
                </div>
              </div>
            </aside>

            <div id="lesson-content">
              <div class="card" style="padding: 32px; text-align: center;">
                <div class="empty-state">
                  <div class="empty-state-icon">📖</div>
                  <h3 class="empty-state-title">Chọn bài học để bắt đầu</h3>
                  <p class="empty-state-desc">Nhấn vào một bài học trong danh sách bên trái để xem nội dung</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      Learning.init(courseId);
    });
  </script>
</body>
</html>
